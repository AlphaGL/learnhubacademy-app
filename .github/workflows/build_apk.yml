name: Build & Release APK

# Trigger manually: Actions → "Build & Release APK" → Run workflow → type the version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.1'
        required: true
        default: '1.0.0'
      notes:
        description: "What's New (one feature per line — shown in-app)"
        required: false
        default: ''
      mandatory:
        description: 'Force this update (blocks the app until installed)?'
        type: boolean
        required: false
        default: false

# Repo settings → Secrets and variables → Actions
#   Secrets (Settings → Secrets):
#     KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD     (app signing)
#     SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_WEB_CLIENT_ID,
#     CLOUDINARY_CLOUD_NAME, PAYSTACK_PUBLIC_KEY                   (dart_define.json — see dart_define.example.json)
#     SUPABASE_SERVICE_KEY                                         (service_role key — publishes the update row; NOT the anon key)
#     R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY                       (Cloudflare R2)
#   Variables (Settings → Variables):
#     R2_ACCOUNT_ID   = your Cloudflare account id
#     R2_BUCKET       = the R2 bucket name, e.g. learnhub-app
#     R2_PUBLIC_URL   = your connected custom domain, e.g. https://dl.learnhubacademy.org
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/learnhub-upload.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storeFile=learnhub-upload.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Prints the signing certificate's SHA-1/SHA-256 in the build log. Add the
      # SHA-1 to Firebase (Project Settings → Android app → Add fingerprint) so
      # native Google Sign-In works, then re-download google-services.json.
      - name: Print signing SHA-1 (for Google Sign-In)
        run: |
          keytool -list -v \
            -keystore android/learnhub-upload.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" | grep -E "SHA1:|SHA-1:|SHA256:" || true

      # Public/publishable values only — see dart_define.example.json. Anon key
      # is safe to ship because access is governed by Supabase RLS.
      - name: Create dart_define.json
        run: |
          cat > dart_define.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "GOOGLE_WEB_CLIENT_ID": "${{ secrets.GOOGLE_WEB_CLIENT_ID }}",
            "CLOUDINARY_CLOUD_NAME": "${{ secrets.CLOUDINARY_CLOUD_NAME }}",
            "PAYSTACK_PUBLIC_KEY": "${{ secrets.PAYSTACK_PUBLIC_KEY }}"
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      # --obfuscate scrambles the compiled code so the APK is hard to reverse
      # engineer; the symbols are kept so Crashlytics stack traces stay readable.
      - name: Build release APK (obfuscated)
        run: |
          flutter build apk --release \
            --build-name=${{ github.event.inputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=dart_define.json \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk learnhub-${{ github.event.inputs.version }}.apk

      # Upload to Cloudflare R2 (S3-compatible). The public URL is served from
      # your own domain, so users never see GitHub. R2 egress is free.
      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Avoid the integrity-checksum headers that newer aws-cli adds, which R2 rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          APK: learnhub-${{ github.event.inputs.version }}.apk
        run: |
          # no-cache so Cloudflare never serves a stale APK (which causes an
          # endless "update available" loop on a build re-upload).
          # Versioned file (what the in-app updater points at).
          aws s3 cp "$APK" "s3://$BUCKET/$APK" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "no-cache, max-age=0, must-revalidate"
          # Stable "latest" alias for the website download button.
          aws s3 cp "$APK" "s3://$BUCKET/learnhub-latest.apk" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      # Keep the de-obfuscation symbols so you can read crash reports later.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.event.inputs.version }}
          path: build/symbols
          retention-days: 90

      # Registers this build in Supabase so the in-app "Update available" prompt
      # fires for existing users. apk_url points at YOUR R2 domain, not GitHub.
      - name: Register release in Supabase
        env:
          NOTES: ${{ github.event.inputs.notes }}
          VERSION: ${{ github.event.inputs.version }}
          MANDATORY: ${{ github.event.inputs.mandatory }}
          RUN_NUMBER: ${{ github.run_number }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          APK_URL="$R2_PUBLIC_URL/learnhub-$VERSION.apk"
          # jq builds the JSON so the notes (newlines / quotes) are escaped safely.
          PAYLOAD=$(jq -n \
            --argjson vc "$RUN_NUMBER" \
            --arg vn "$VERSION" \
            --arg url "$APK_URL" \
            --argjson mandatory "$MANDATORY" \
            --arg notes "$NOTES" \
            '{version_code:$vc, version_name:$vn, apk_url:$url, mandatory:$mandatory, notes:$notes}')
          curl -s -X POST "$SUPABASE_URL/rest/v1/app_release" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            && echo "Registered v$VERSION -> $APK_URL" \
            || echo "Supabase register failed — check SUPABASE_URL / SUPABASE_SERVICE_KEY secrets"
